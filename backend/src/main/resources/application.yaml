spring:
  application:
    name: localia
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/localia}
    username: ${DATABASE_USERNAME:localia}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 30
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
localia:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    es.localia.plataforma: INFO
---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations: classpath:db/migration,classpath:db/demo
